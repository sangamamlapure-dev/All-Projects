limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=per_client:10m;

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /run/secrets/tls_fullchain;
    ssl_certificate_key /run/secrets/tls_privkey;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    auth_basic "NeuroForge private staging";
    auth_basic_user_file /run/secrets/nginx_htpasswd;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        limit_req zone=api_rate burst=12 nodelay;
        limit_req_status 429;
        limit_conn per_client 6;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
